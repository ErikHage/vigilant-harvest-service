name: Docker image

# Runs lint and the unit tests on every push and pull request, then, if they
# pass, builds the image, and pushes it to Docker Hub from master only, as
# ehage/vigilant-harvest-service:latest and :sha-<commit>.
#
# Repository secrets:
#   NPM_TOKEN        npm granular token, read-only, for the private
#                    @feral-auth packages. The checks job's npm ci reads it
#                    from the environment; it reaches the image build only
#                    as a BuildKit secret, so it's in no layer of the image.
#   DOCKERHUB_TOKEN  Docker Hub access token for ehage, Read & Write.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ehage/vigilant-harvest-service

jobs:
  # Lint, and the unit suite type-checked and run, on the Node the image runs
  # (node:24-alpine). The acceptance suite needs a running service and
  # database, so it isn't run here
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # registry-url writes an .npmrc that reads the token from NODE_AUTH_TOKEN
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - run: npm run lint

      # vitest doesn't type-check, so a type error in a spec needs this
      - run: npm run tsc:unit

      - run: npm run test:unit

  # Only once lint and the unit tests have passed
  image:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          username: ehage
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # The Dockerfile mounts this as .npmrc while npm ci runs
          secrets: |
            npmrc=//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
