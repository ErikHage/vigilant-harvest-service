name: Docker image

# Builds the image on every push and pull request, and pushes it to Docker Hub
# from master only, as ehage/vigilant-harvest-service:latest and :sha-<commit>.
#
# Repository secrets:
#   NPM_TOKEN        npm granular token, read-only, for the private
#                    @feral-auth packages. It reaches the build only as a
#                    BuildKit secret, so it's in no layer of the image.
#   DOCKERHUB_TOKEN  Docker Hub access token for ehage, Read & Write.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ehage/vigilant-harvest-service

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/master'
        with:
          username: ehage
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # The Dockerfile mounts this as .npmrc while npm ci runs
          secrets: |
            npmrc=//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
